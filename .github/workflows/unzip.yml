name: Unzip site files

on:
  push:
    branches: [main]
    paths:
      - soulocta-site-deploy.zip
      - .github/workflows/unzip.yml

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip site files and commit
        run: |
          if [ -f soulocta-site-deploy.zip ]; then
            unzip -o soulocta-site-deploy.zip
            rm soulocta-site-deploy.zip
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Extract SoulOcta site files from zip" || echo "Nothing to commit"
            git push
          else
            echo "No zip file found, nothing to do"
          fi
